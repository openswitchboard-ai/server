name: full
# Slow/thorough suite. Runs on: manual dispatch, weeknightly schedule,
# or a push whose commit message contains [full-ci]. Not on ordinary pushes.
# No AWS credentials needed here (no OIDC).

on:
  workflow_dispatch:
  schedule:
    - cron: '0 17 * * 0-4'   # 03:00 AEST Mon–Fri
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[full-ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - uses: docker/setup-buildx-action@v3
      - name: docker build (image must stay buildable for CDK)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: osb-server:full
          cache-from: type=gha
          cache-to: type=gha,mode=max
